# Publishes to npm via OIDC trusted publishing (no NPM_TOKEN needed).
# One-time setup on npmjs.com: package -> Settings -> Trusted publishing -> GitHub Actions
#   owner=winor30, repo=mcp-server-datadog, workflow=publish.yml
# Release by bumping the version and pushing a tag like `v1.8.0`.
# NOTE: Publishing requires the `npm-publish` GitHub environment to be configured
# with required reviewers to prevent ungated OIDC token use (CWE-862).
name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish # Requires manual approval - configure required reviewers in GitHub Settings > Environments

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish
        run: npm publish --access public --ignore-scripts --provenance
